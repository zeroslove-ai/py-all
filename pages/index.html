<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임빌더 v2</title>
  <style>
    /* ─── CSS Variables (Dark Theme) ─── */
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --border: #2a2a4a;
      --success: #4ecca3;
      --warning: #f4d03f;
      --danger: #e74c3c;
      --font-mono: 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 8px;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header ─── */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header h1 { font-size: 1.2rem; color: var(--accent); }
    .header .meta { font-size: 0.8rem; color: var(--text-secondary); }
    .header .meta span { margin-left: 12px; }
    .header-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    /* ─── Main Layout ─── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ─── Story Stream (Left/Center) ─── */
    .story-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .story-stream {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      line-height: 1.8;
      font-size: 1rem;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .story-stream .narrative { margin-bottom: 16px; }
    /* 플레이 기록 모달 */
    .history-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 60; }
    .history-modal { background: var(--panel, #1b1f27); color: inherit; width: min(640px, 100%); max-height: 85vh; overflow-y: auto; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .history-modal-header { display: flex; align-items: center; justify-content: space-between; }
    .history-modal-header h2 { margin: 0; font-size: 1.1rem; }
    .history-modal-actions { display: flex; gap: 8px; }
    .history-modal-actions button, .history-close, .history-more { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border, #333); background: transparent; color: inherit; cursor: pointer; }
    .history-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .history-turn { border: 1px solid var(--border, #333); border-radius: 8px; padding: 10px; }
    .history-turn-title { font-weight: 700; margin-bottom: 6px; }
    .history-turn-action, .history-turn-summary { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9rem; margin-bottom: 4px; }
    .history-turn details { margin-top: 6px; }
    .history-turn summary { cursor: pointer; color: var(--muted, #999); }
    .history-section-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.85rem; margin-top: 6px; }
    .history-mind-meta { font-size: 0.7rem; color: var(--muted, #777); margin-top: 4px; }
    .history-error { color: #ff8080; font-size: 0.85rem; }
    .history-empty { color: var(--muted, #999); text-align: center; padding: 24px 0; }
    .history-more { align-self: center; }
    @media (max-width: 480px) {
      .history-modal { width: 100%; max-height: 92vh; border-radius: 0; }
      .history-modal-overlay { align-items: flex-end; }
    }
    .story-stream .pending-turn-action-notice { margin-bottom: 16px; white-space: pre-wrap; word-break: keep-all; }
    .pending-turn-action-details { margin-top: 8px; font-size: 0.85rem; color: var(--muted); }
    .pending-turn-action-details summary { cursor: pointer; }
    .pending-turn-action-details ul { margin: 6px 0 0; padding-left: 20px; }
    .story-stream .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }
    .story-stream .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: var(--accent);
      animation: blink 1s infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    /* ─── Side Panel (Right) ─── */
    .side-panel {
      width: 320px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .side-panel .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .side-panel .panel-title {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* Character Image */
    .character-img {
      width: 100%;
      height: 440px;
      object-fit: contain;
      object-position: top center;
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      display: block;
    }
    .character-img.hidden { display: none; }

    /* Mind Monitor */
    .mind-monitor {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      padding: 12px;
      border-radius: var(--radius);
      display: grid;
      gap: 10px;
    }
    .mind-item { display: grid; gap: 5px; }
    .mind-item b { color: var(--text-primary); }
    .mind-item blockquote, .mind-item p { margin: 0; white-space: pre-wrap; }
    .mind-item blockquote { padding-left: 10px; border-left: 2px solid var(--accent); color: var(--text-primary); font-style: italic; }
    .mind-item p { color: var(--text-secondary); }

    /* Player Status */
    .player-status {
      font-size: 0.85rem;
    }
    .player-status .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .player-status .stat-label { color: var(--text-secondary); }
    .player-status .stat-value { color: var(--accent); }
    .character-info-compact, .npc-status, .relationship-inline { font-size: 0.85rem; }
    .character-info-compact { display: grid; gap: 6px; line-height: 1.45; }
    .character-affiliation { color: var(--text-primary); font-weight: 700; }
    .relationship-inline {
      display: block;
      white-space: nowrap;
      font-size: 0.85rem;
      color: var(--text-primary);
      background: var(--bg-tertiary);
      padding: 9px 10px;
      border-radius: var(--radius);
    }
    .relationship-inline strong { color: var(--accent); font-weight: 800; }
    .stat-value.signal-green { color: #4ade80; }
    .stat-value.signal-yellow { color: #facc15; }
    .stat-value.signal-red { color: #fb7185; }
    .delta-up { color: #4ade80; } .delta-down { color: #fb7185; }

    /* Audio Player */
    .audio-player {
      display: none;
    }
    .audio-player.active {
      display: block;
      width: 100%;
      margin-top: 8px;
    }
    .side-panel-footer {
      margin-top: auto;
      position: sticky;
      bottom: 0;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      z-index: 2;
    }
    .side-action-row { display: flex; gap: 8px; }
    .side-action-btn {
      width: calc(50% - 4px);
      padding: 12px 16px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .side-action-btn:hover { background: var(--accent-hover); }
    .side-action-btn:disabled { cursor: wait; opacity: .65; }
    .npc-status-inline {
      display: block;
      max-height: 2.6em;
      overflow: hidden;
      line-height: 1.3;
      font-size: .85rem;
      word-break: keep-all;
      background: var(--bg-tertiary);
      padding: 9px 10px;
      border-radius: var(--radius);
    }
    .npc-status-inline .stat-value { white-space: nowrap; }

    /* ─── Bottom Bar ─── */
    .bottom-bar {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      flex-shrink: 0;
    }

    /* Choice Buttons */
    .choice-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 8px;
      max-height: 42vh;
      overflow-y: auto;
    }
    .choice-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      height: auto;
      min-height: 38px;
      padding: 8px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      text-align: left;
      line-height: 1.45;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .choice-btn .choice-label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .choice-btn:hover {
      border-color: var(--accent);
      background: var(--bg-primary);
    }
    .choice-btn .marker {
      color: var(--accent);
      font-weight: bold;
      margin-right: 6px;
    }
    .choice-btn.explicit {
      border-color: var(--warning);
    }
    .choice-btn.selected { border-color: var(--accent); background: rgba(233, 69, 96, .18); }
    .choice-btn:disabled { cursor: not-allowed; opacity: .7; }

    /* Chat Input */
    .chat-input-row {
      display: flex;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send {
      background: var(--accent);
      border: none;
      color: white;
      padding: 7px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .chat-send:hover { background: var(--accent-hover); }
    .chat-send:disabled {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
    }
    .loading.active { display: block; }
    .story-loading {
      flex-shrink: 0;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tts-toggle, .command-toggle, .tts-replay { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; cursor: pointer; white-space: nowrap; }
    .tts-status { max-width: min(460px, 48vw); font-size: .78rem; color: var(--text-secondary); }
    .tts-status.error { color: var(--warning); }
    .reset-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; display: grid; place-items: center; padding: 20px; overflow-y: auto; }
    .reset-modal { max-width: 480px; width: 100%; box-sizing: border-box; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: grid; gap: 14px; }
    .reset-actions { display: flex; gap: 10px; justify-content: flex-end; } .reset-actions .danger { background: var(--danger); }
    .feedback-modal-textarea {
      width: 100%; box-sizing: border-box; min-height: 5.5em; resize: vertical;
      font: inherit; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary);
    }
    .feedback-modal-error { color: var(--warning); font-size: .85rem; margin: 0; }
    .app-manual-overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.65); }
    .app-manual-modal { width: min(900px, calc(100vw - 32px)); max-height: min(88vh, 920px); display: flex; flex-direction: column; overflow: hidden; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); }
    .app-manual-header { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: flex-start; padding: 18px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    .app-manual-header h2 { margin: 0; font-size: 1.15rem; } .app-manual-header p { margin: 4px 0 0; color: var(--text-secondary); font-size: .85rem; }
    .app-manual-close { margin-left: auto; flex: 0 0 auto; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; cursor: pointer; }
    .app-manual-body { overflow-y: auto; padding: 18px 20px 24px; display: grid; gap: 12px; }
    .app-manual-status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .app-manual-card, .app-manual-diagnostic, .app-manual-active-item { padding: 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); }
    .app-manual-card small { display: block; color: var(--text-secondary); } .app-manual-card strong { display: block; margin-top: 3px; }
    .app-manual-progress { height: 7px; margin-top: 7px; border-radius: 999px; overflow: hidden; background: var(--bg-primary); }
    .app-manual-progress-fill { height: 100%; background: var(--accent); }
    .app-manual-diagnostic.success { border-color: var(--success); } .app-manual-diagnostic.warning { border-color: var(--warning); } .app-manual-diagnostic.info { border-color: var(--accent); }
    .app-manual-section { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-primary); } .app-manual-section summary, .app-manual-tier summary { cursor: pointer; padding: 12px; font-weight: 700; }
    .app-manual-section > div { padding: 0 12px 12px; } .app-manual-tier { margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-secondary); }
    .app-manual-list { margin: 0; padding-left: 20px; } .app-manual-list li { margin: 5px 0; } .app-manual-active-item { margin: 8px 0; white-space: pre-wrap; }
    .app-manual-error { padding: 20px; text-align: center; color: var(--warning); } .app-manual-error-actions { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }

    /* Responsive */
    @media (max-width: 768px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; }
      .main { display: flex; flex-direction: column; overflow: visible; }
      .story-panel, .story-stream { overflow: visible; }
      .story-loading { scroll-margin-bottom: 76px; }
      .side-panel { display: flex; width: 100%; border-left: none; border-top: 1px solid var(--border); overflow: visible; }
      .side-panel-footer { position: static; }
      .character-img { width: 100%; height: min(620px, 125vw); object-fit: contain; object-position: top center; }
      .bottom-bar { position: sticky; bottom: 0; z-index: 20; }
      .header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: var(--bg-secondary);
        padding: 10px 12px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .header-controls { margin-left: 0; width: 100%; }
      .tts-status { max-width: none; flex: 1 1 160px; }
      .app-manual-overlay { padding: 0; } .app-manual-modal { width: 100%; height: 100dvh; max-height: none; border-radius: 0; }
      .app-manual-header { padding-top: max(14px, env(safe-area-inset-top)); } .app-manual-body { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
      .app-manual-status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice-buttons { grid-template-columns: 1fr; gap: 9px; max-height: 46vh; }
      .choice-btn { width: 100%; min-width: 0; padding: 8px 10px; text-align: left; }
    }
    @media (max-width: 340px) { .app-manual-status-grid { grid-template-columns: 1fr; } }
    .version-info {
      position: fixed;
      right: 6px;
      bottom: 2px;
      font-size: 0.65rem;
      color: var(--muted);
      opacity: 0.55;
      pointer-events: none;
      z-index: 5;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="version-info" id="version-info"></div>
  <header class="header">
    <h1>🎮 게임빌더 v2</h1>
    <div class="meta">
      <span id="game-title">게임 제목</span>
      <span id="turn-count">턴: 0</span>
      <span id="mode-badge">플레이</span>
    </div>
    <div class="header-controls">
      <button class="tts-toggle" id="tts-toggle" type="button" aria-pressed="true">🔊 음성 ON</button>
      <button class="tts-replay" id="tts-replay" type="button" hidden>▶ 재생</button>
      <button class="history-toggle" id="history-toggle" type="button">📖 플레이 기록</button>
      <button class="command-toggle" id="command-toggle" type="button">/ 안내</button>
      <span class="tts-status" id="tts-status" role="status" hidden></span>
    </div>
  </header>
  <div class="main">
    <div class="story-panel">
      <div class="story-stream" id="story-stream"></div>
      <div class="loading story-loading" id="loading" role="status" aria-live="polite">서사를 불러오는 중</div>
    </div>

    <aside class="side-panel">
      <div class="panel-section">
        <div class="panel-title">캐릭터</div>
        <img class="character-img hidden" id="character-img" alt="character">
      </div>

      <div class="panel-section">
        <div class="panel-title">마인드 모니터</div>
        <div class="mind-monitor" id="mind-monitor">(대기 중)</div>
      </div>

      <div class="panel-section">
        <div class="panel-title">플레이어 상황</div>
        <div class="player-status" id="player-status">
          <div class="stat-row"><span class="stat-label">위치</span><span class="stat-value" id="stat-location">-</span></div>
          <div class="stat-row"><span class="stat-label">순응도</span><span class="stat-value" id="stat-순응도">-</span></div>
          <div class="stat-row"><span class="stat-label">호감도</span><span class="stat-value" id="stat-호감도">-</span></div>
          <div class="stat-row"><span class="stat-label">최면깊이</span><span class="stat-value" id="stat-최면깊이">-</span></div>
          <div class="stat-row"><span class="stat-label">상식개변</span><span class="stat-value" id="stat-csa">없음</span></div>
        </div>
      </div>

    </aside>
  </div>
  <!-- H3-A item 7: lives outside .side-panel — sidebar.init() replaces
       .side-panel's entire innerHTML on every (re)render, which would
       otherwise destroy and orphan this element and its live playback. -->
  <audio class="audio-player" id="audio-player" controls></audio>

  <div class="bottom-bar">
    <div class="choice-buttons" id="choice-buttons"></div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="chat-input" placeholder="행동을 입력하거나 선택지를 클릭하세요..." autocomplete="off">
      <button class="chat-send" id="chat-send">전송</button>
    </div>
  </div>

  <script src="state.js"></script>
  <script src="api.js"></script>
  <script src="stream.js"></script>
  <script src="ui.js"></script>
  <script src="sidebar.js"></script>
  <script src="tts.js"></script>
  <script src="history.js"></script>
  <script>
    // ─── Entry Point ───
    const GAME_ID = new URLSearchParams(location.search).get('game') || localStorage.getItem('gameId');
    if (GAME_ID) {
      state.gameId = GAME_ID;
      localStorage.setItem('gameId', GAME_ID);
      loadGameContext();
    } else {
      ui.showSystemMessage('게임 ID가 없습니다. URL에 ?game=GAME_ID를 추가하거나 /api/context로 게임을 로드하세요.');
    }
    // Fire-and-forget, independent of game load — a slow or failed version
    // check must never block or break the actual game.
    loadVersionInfo();

    // Deploy-mismatch check: frontend/version.json is a static asset
    // regenerated at each frontend deploy (scripts/deploy-frontend.mjs) with
    // the exact commit SHA being deployed; /api/version reports the API
    // Worker's own tag the same way (scripts/deploy-worker.mjs). Fetched
    // once here at startup and cached in the DOM text — never re-fetched on
    // every render.
    async function loadVersionInfo() {
      const el = document.getElementById('version-info');
      if (!el) return;
      let frontendSha = 'unknown';
      try {
        const res = await fetch('version.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (typeof data?.sha === 'string' && data.sha.trim()) frontendSha = data.sha.trim().slice(0, 12);
        }
      } catch { /* frontendSha stays 'unknown' */ }
      let apiTag = 'unavailable';
      try {
        const version = await api.version();
        // A null tag is never assumed to mean "latest" — shown as unknown
        // instead of silently treating a null/missing tag as up to date.
        apiTag = typeof version?.tag === 'string' && version.tag.trim() ? version.tag.trim() : 'unknown';
      } catch { /* apiTag stays 'unavailable' — /api/version itself failed */ }
      el.textContent = `frontend: ${frontendSha} · api: ${apiTag}`;
    }

    async function loadGameContext() {
      ui.setLoading(true);
      try {
        const ctx = await api.context(state.gameId);
        state.turnCount = ctx.turn_count ?? 0;
        state.imageCatalog = ctx.image_catalog || {};
        state.context = ctx.context || null;
        ui.updateMeta(ctx.context?.master?.title || ctx.context?.title || '게임 제목', state.turnCount);
        sidebar.updateContext(state.context);
        const activeCharacterId = state.context?.save?.last_character_id;
        if (activeCharacterId && activeCharacterId !== 'narrator') {
          sidebar.updateMind(state.context?.save?.npc_emotion?.[activeCharacterId]);
          sidebar.renderStats(state.context?.save?.npc_stats?.[activeCharacterId], activeCharacterId, state.context?.save?.npc_stat_changes?.[activeCharacterId]);
          api.image(state.gameId, activeCharacterId, state.context?.save?.last_image_id)
            .then(res => { if (res.image_url) ui.showImage(res.image_url); })
            .catch(() => {});
        }
        ui.setLoading(false);

        const setupIncomplete = state.context?.save?.player_setup?.status !== 'complete';
        const hasNoMemories = !(state.context?.recent_memories || []).length;
        if (state.turnCount === 0 && setupIncomplete && hasNoMemories && !state.startupRequested) {
          await startPlayerSetup();
        }
      } catch (e) {
        ui.showSystemMessage('컨텍스트 로드 실패: ' + e.message);
        ui.setLoading(false);
      }
    }

    // Reset then re-load the (now empty) server context — loadGameContext()
    // already auto-starts player_setup on its own whenever it sees turn 0 +
    // incomplete setup + no memories, which is exactly what a fresh reset
    // always produces. Reusing that path (instead of calling
    // startPlayerSetup() directly) is what makes this behave identically to
    // a page refresh, which is the same recovery a user was previously
    // forced into.
    //
    // Every step from api.reset() onward is wrapped so a DOM-layer failure
    // (clearGameView() touches optional DOM some layouts don't have) can
    // never silently swallow the rest of the reset — previously there was
    // no try/catch here at all, so an exception thrown mid-reset aborted
    // before startPlayerSetup() ever ran, and only a full page refresh
    // (which never calls clearGameView()) recovered.
    async function resetAndStartNewGame() {
      try {
        await api.reset(state.gameId);
      } catch (error) {
        const code = error.status || error.details?.error_code || 'UNKNOWN';
        ui.showSystemMessage(`게임 초기화에 실패했습니다. [${code}]`);
        return;
      }

      // Full local reset — mirrors a fresh page load's starting state so no
      // flag/notice/pending state left over from before the reset can block
      // or corrupt the new game's own startup.
      state.startupRequested = false;
      state.inputLocked = false;
      state.isStreaming = false;
      state.turnCount = 0;
      state.context = null;
      // 새 게임 초기화 후 이전 플레이 기록이 다시 나타나면 안 된다.
      playHistory.onGameReset();

      try {
        // Removes the previous game's narrative/dividers (and, nested
        // inside them, any uncommitted badge), the pending-turn-action
        // notice, and the choice buttons in one call.
        ui.clearGameView();
      } catch (error) {
        console.error('clearGameView() failed during reset', error);
      }
      ui.showSystemMessage('게임을 초기화했습니다.\n새 게임을 준비하고 있습니다…');

      // loadGameContext() owns the state.startupRequested guard (via
      // startPlayerSetup()), so this can never fire a duplicate Story
      // request even under a rapid double-click or a race with another
      // in-flight load.
      await loadGameContext();
    }

    // ─── Event Listeners ───
    document.getElementById('chat-send').addEventListener('click', async () => { await tts.unlockAudio(); handleTurnInput(); });
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { tts.unlockAudio(); handleTurnInput(); }
    });
    tts.init();
    document.getElementById('command-toggle').addEventListener('click', () => handleCommand('/안내'));
    document.getElementById('history-toggle').addEventListener('click', () => { playHistory.cache.gameId = state.gameId; playHistory.toggle(); });

    function restoreLastTurn() {
      const memories = state.context?.recent_memories || [];
      const last = memories[memories.length - 1];
      const narrative = typeof last === 'string' ? last : last?.content || '';
      ui.restoreNarrative(narrative);
    }

    function isPlainObject(value) {
      return value !== null && typeof value === 'object' && !Array.isArray(value);
    }

    // Mirrors the Worker's own JSONB patch semantics: object keys deep-merge
    // one level (so e.g. active_suggestions for an NPC this turn never
    // touched survives a patch that only carries another NPC's list),
    // arrays and primitives overwrite wholesale — matches how commit_turn's
    // own Supabase merge behaves, so the frontend never has to guess.
    function deepMergeStatePatch(target, patch) {
      const base = isPlainObject(target) ? target : {};
      if (!isPlainObject(patch)) return base;
      const merged = { ...base };
      for (const [key, value] of Object.entries(patch)) {
        merged[key] = isPlainObject(value) && isPlainObject(merged[key]) ? { ...merged[key], ...value } : value;
      }
      return merged;
    }

    function feedbackKey() { return `gameFeedback:${state.gameId}`; }
    function getFeedback() { try { return JSON.parse(localStorage.getItem(feedbackKey()) || '[]'); } catch { return []; } }
    function saveFeedback(items) { localStorage.setItem(feedbackKey(), JSON.stringify(items)); }

    async function handleCommand(input) {
      const [command, ...rest] = input.trim().split(/\s+/);
      const value = rest.join(' ').trim();
      if (['/안내', '/도움말', '/help'].includes(command)) {
        ui.showSystemMessage('사용 가능한 명령어\n/플레이 — 현재 상태 새로고침\n/리셋 — 진행 기록 초기화\n/피드백 내용 — 마지막 턴을 취소하고 내용을 반영해 다시 생성\n/음성 켜기 · /음성 끄기');
      } else if (command === '/플레이') {
        await resumeGame();
      } else if (command === '/리셋') {
        showResetModal();
      } else if (command === '/피드백') {
        if (!value) { showFeedbackModal(); return; }
        const rollback = await requestFeedbackRollback(value, message => ui.showSystemMessage(message));
        if (rollback) {
          ui.showSystemMessage('마지막 턴을 다시 만드는 중...');
          await runFeedbackRegeneration(rollback, value);
        }
      } else if (command === '/음성' && value === '켜기') {
        setAutoTts(true); ui.showSystemMessage('자동 음성을 켰습니다.');
      } else if (command === '/음성' && value === '끄기') {
        setAutoTts(false); ui.showSystemMessage('자동 음성을 껐습니다.');
      } else ui.showSystemMessage('알 수 없는 명령어입니다. /안내를 입력해 보세요.');
    }

    function setAutoTts(enabled) { tts.setEnabled(enabled); }

    function showResetModal() {
      if (state.isStreaming) { ui.showSystemMessage('다른 요청이 진행 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
      const overlay = document.createElement('div'); overlay.className = 'reset-modal-overlay';
      overlay.innerHTML = `<div class="reset-modal" role="dialog" aria-modal="true"><h2>게임을 리셋할까요?</h2><p>현재 진행 기록이 삭제되고 처음부터 시작합니다.</p><div class="reset-actions"><button class="choice-btn cancel">취소</button><button class="choice-btn danger confirm">리셋</button></div></div>`;
      const close = () => overlay.remove();
      overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
      overlay.querySelector('.cancel').addEventListener('click', close);
      overlay.querySelector('.confirm').addEventListener('click', async () => { close(); await resetAndStartNewGame(); });
      document.addEventListener('keydown', function onKey(event) { if (event.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } });
      document.body.appendChild(overlay); overlay.querySelector('.cancel').focus();
    }

    // /api/feedback now only rolls back the last committed turn and hands
    // back the original player input/action — it never calls Story/Extract/
    // Commit itself. Shared by both the /피드백 텍스트 명령 and the 피드백
    // 팝업's "다시 생성" button so they can never drift into different
    // rollback behavior. Returns the rollback response on success, or null
    // (after reporting via onError) on failure — the popup uses this to
    // decide whether to stay open.
    async function requestFeedbackRollback(feedbackText, onError) {
      if (state.isStreaming) {
        onError('다른 요청이 진행 중입니다. 잠시 후 다시 시도해 주세요.');
        return null;
      }
      try {
        return await api.feedbackRollback(state.gameId, feedbackText, state.turnCount);
      } catch (error) {
        onError(error.message || `피드백 재생성에 실패했습니다. [${error.status || 'UNKNOWN'}]`);
        return null;
      }
    }

    // Runs after a successful rollback — from here on this is just a normal
    // turn (real /api/story SSE, real typing, real Extract/Commit) with the
    // original resolved input replayed and the feedback text injected as the
    // highest-priority regeneration block. Any failure from here on is
    // handled by runTurn()'s own pending.rollbackInfo branch (restore the
    // rolled-back turn), not by this function.
    async function runFeedbackRegeneration(rollback, feedbackText) {
      // 기존 마지막 턴 UI 제거 — 이 앱은 항상 마지막 턴만 보여주므로 전체
      // narrative/구분선/선택지를 비우면 충분하다.
      ui.restoreNarrative('');
      ui.els.choiceButtons.replaceChildren();
      await runTurn({
        playerInput: rollback.player_input,
        source: rollback.player_action?.source || 'direct_text',
        choiceIndex: Number.isInteger(rollback.player_action?.choice_index) ? rollback.player_action.choice_index : null,
        choiceText: rollback.player_action?.choice_text || null,
        regenerationFeedback: feedbackText,
        expectedTurnNumber: rollback.rolled_back_turn_number - 1,
        rollbackInfo: { turnNumber: rollback.rolled_back_turn_number, restorePayload: rollback.restore_payload }
      });
    }

    // Best-effort recovery when a feedback-regeneration turn fails somewhere
    // in Story/Extract/Commit — restores the rolled-back turn server-side,
    // then re-syncs the screen to whatever is now actually committed
    // (reusing restoreToLastCommittedTurn exactly like resume/discard do).
    async function restoreFeedbackTurnAfterFailure(pending, defaultMessage) {
      let message = defaultMessage;
      try {
        await api.feedbackRestore(state.gameId, pending.rollbackInfo.turnNumber, pending.rollbackInfo.restorePayload);
      } catch (restoreError) {
        message = '재생성과 기존 턴 복구에 실패했습니다. 화면을 새로 불러와 주세요.';
      }
      await restoreToLastCommittedTurn(message);
    }

    function showFeedbackModal() {
      if (state.isStreaming) { ui.showSystemMessage('다른 요청이 진행 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
      const overlay = document.createElement('div'); overlay.className = 'reset-modal-overlay';
      overlay.innerHTML = `<div class="reset-modal" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
        <h2 id="feedback-modal-title">마지막 턴 다시 만들기</h2>
        <p>마지막 턴을 취소하고, 아래 내용을 반영해 같은 행동부터 다시 생성합니다.</p>
        <textarea class="feedback-modal-textarea" rows="4" aria-label="피드백 내용" placeholder="예: 이미 옷을 벗은 상태입니다. 다시 입히지 말고 이어가 주세요."></textarea>
        <p class="feedback-modal-error" hidden></p>
        <div class="reset-actions"><button class="choice-btn cancel">취소</button><button class="choice-btn danger confirm">다시 생성</button></div>
      </div>`;
      let submitting = false;
      const close = () => { if (!submitting) overlay.remove(); };
      const textarea = overlay.querySelector('.feedback-modal-textarea');
      const errorEl = overlay.querySelector('.feedback-modal-error');
      const cancelBtn = overlay.querySelector('.cancel');
      const confirmBtn = overlay.querySelector('.confirm');
      const showError = message => { errorEl.textContent = message; errorEl.hidden = false; };
      overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
      cancelBtn.addEventListener('click', close);
      const onKey = event => { if (event.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      confirmBtn.addEventListener('click', async () => {
        const value = textarea.value.trim();
        if (!value) { showError('수정할 내용을 입력해 주세요.'); return; }
        submitting = true;
        cancelBtn.disabled = true; confirmBtn.disabled = true; textarea.disabled = true;
        errorEl.hidden = true;
        confirmBtn.textContent = '다시 생성하는 중...';
        // 팝업은 롤백 성공 시점에 즉시 닫는다 — 이후 Story/Extract/Commit은
        // 일반 턴과 똑같이 보여야 하고, 그 단계의 실패는 팝업이 아니라
        // 일반 턴 실패 UI(재시도 알림/자동 복구)가 처리한다.
        const rollback = await requestFeedbackRollback(value, showError);
        submitting = false;
        if (rollback) {
          document.removeEventListener('keydown', onKey);
          overlay.remove();
          await runFeedbackRegeneration(rollback, value);
        } else {
          cancelBtn.disabled = false; confirmBtn.disabled = false; textarea.disabled = false;
          confirmBtn.textContent = '다시 생성';
        }
      });
      document.body.appendChild(overlay); textarea.focus();
    }

    // 선택지 번호 단독 입력(1~4/A~D/①~④)은 direct_marker로 표시한다 —
    // 최종 검증과 resolved_input 결정은 Worker가 한다.
    const DIRECT_MARKER_INPUT_RE = /^(?:[1-4]|[A-Da-d]|[①②③④])$/;

    // Single common entry point for every turn — normal input, choice
    // clicks, player-setup start, and feedback regeneration all build a
    // pending object and hand it to retryStory(). regenerationFeedback/
    // expectedTurnNumber/rollbackInfo are no-ops for a normal turn (all
    // default to null) and only ever populated by runFeedbackRegeneration().
    async function runTurn({
      playerInput, source = 'direct_text', choiceIndex = null, choiceText = null,
      regenerationFeedback = null, expectedTurnNumber = null, systemStart = false, rollbackInfo = null
    } = {}) {
      const nextTurn = (Number.isInteger(expectedTurnNumber) ? expectedTurnNumber : state.turnCount) + 1;
      const playerAction = { source, raw_input: playerInput, choice_index: choiceIndex, choice_text: choiceText };
      await retryStory({
        input: playerInput, nextTurn, narrative: null, extract: null, mode: null,
        narrativeElement: null, playerAction, regenerationFeedback, systemStart, rollbackInfo
      });
    }

    async function handleTurnInput(actionMeta = { source: 'direct_text' }) {
      const input = document.getElementById('chat-input').value.trim();
      if (!input || !state.gameId || state.isStreaming) return;
      document.getElementById('chat-input').value = '';
      if (input.startsWith('/')) { await handleCommand(input); return; }
      ui.addUserMessage(input);
      const meta = actionMeta && typeof actionMeta === 'object' ? actionMeta : { source: 'direct_text' };
      const source = meta.source === 'choice_button'
        ? 'choice_button'
        : (DIRECT_MARKER_INPUT_RE.test(input) ? 'direct_marker' : 'direct_text');
      await runTurn({
        playerInput: input, source,
        choiceIndex: Number.isInteger(meta.choice_index) ? meta.choice_index : null,
        choiceText: typeof meta.choice_text === 'string' ? meta.choice_text : null
      });
    }

    // Feedback-regeneration turns fail open into a full restore-and-resync
    // instead of the normal retry-notice UI — this is the one shared check
    // every catch block below makes first. Returns true if it handled the
    // failure (caller should stop), false for a normal turn (caller proceeds
    // with its usual retry UI).
    async function handleTurnFailureAsRollback(pending, message) {
      if (!pending.rollbackInfo) return false;
      ui.failCurrentNarrative();
      await restoreFeedbackTurnAfterFailure(pending, message);
      return true;
    }

    // Finalizes the typing animation exactly once per turn and applies any
    // Extract-driven narrative correction only after that — called from
    // whichever path reaches "the narrative is fully decided" first
    // (reentry, an Extract failure, or a successful commit), regardless of
    // whether the typing animation (renderDone) or the network calls
    // (Extract/Commit) finished first.
    async function finalizeRenderedNarrative(pending) {
      if (pending.narrativeElement) return pending.narrativeElement;
      await pending.renderDone;
      pending.narrativeElement = ui.finalizeNarrative();
      if (pending.narrativeElement && pending.narrativeReplacement) {
        pending.narrativeElement.textContent = ui.stripBoldMarkers(pending.narrativeReplacement);
      } else if (pending.narrativeElement && pending.contentAddition) {
        pending.narrativeElement.textContent += `\n\n${ui.stripBoldMarkers(pending.contentAddition)}`;
      }
      return pending.narrativeElement;
    }

    async function retryStory(pending) {
      state.isStreaming = true;
      ui.setLoading(true, pending.regenerationFeedback ? '마지막 턴을 다시 만드는 중...' : '서사 생성 중');
      ui.clearPendingTurnActions();
      try {
        // networkDone resolves once the full narrative text is in (Extract
        // can start immediately); renderDone resolves once the paced typing
        // queue has finished revealing every character (DOM-visible updates
        // wait for this instead).
        const { networkDone, renderDone } = stream.story(
          state.gameId, pending.input, state.turnCount, chunk => ui.appendNarrative(chunk),
          getFeedback(), pending.regenerationFeedback || null
        );
        pending.renderDone = renderDone;
        const result = await networkDone;
        pending.narrative = result.text; pending.mode = result.mode;
        pending.timing = { ...(pending.timing || {}), story: result.timing };
        if (result.mode === 'reentry') {
          await finalizeRenderedNarrative(pending);
          state.inputLocked = false;
          ui.renderChoices(ui.parseChoices(result.text), submitChoice);
          return;
        }
        await retryExtract(pending);
      } catch (error) {
        ui.setChoicesEnabled(true);
        if (await handleTurnFailureAsRollback(pending, '피드백 재생성에 실패하여 기존 턴을 복구했습니다.')) return;
        ui.failCurrentNarrative();
        const code = error.status || 'UNKNOWN';
        const suffix = error.requestId ? ` · 요청 ${error.requestId}` : '';
        if (pending.systemStart) {
          // Matches resetAndStartNewGame()'s auto-start path — offers a
          // retry AND a plain page refresh (which takes the already-working
          // loadGameContext() auto-start path) rather than a single button.
          ui.showPendingTurnActions(
            `게임 초기화는 완료됐지만 새 게임을 시작하지 못했습니다. [${code}]${suffix}`,
            [
              { label: '새 게임 시작 다시 시도', onClick: () => startPlayerSetup() },
              { label: '페이지 새로고침', onClick: () => window.location.reload() }
            ]
          );
        } else {
          ui.showRetryNotice(`서사 생성에 실패했습니다. [${code}]${suffix}`, '다시 생성', () => retryStory(pending));
        }
      } finally { state.isStreaming = false; ui.setLoading(false); }
    }

    async function retryExtract(pending) {
      state.isStreaming = true;
      state.inputLocked = false;
      ui.setLoading(true, '상태 분석 중');
      ui.clearPendingTurnActions();
      ui.clearUncommittedNarrativeBadges();
      let failed = false;
      try {
        // Started as soon as the network text is ready — runs concurrently
        // with the still-typing display queue, not after it.
        const result = await api.extract(state.gameId, pending.narrative, pending.nextTurn, pending.input);
        console.info('[extract-timing]', result.timing);
        pending.extract = result.extract;
        pending.extract.extract_degraded = result.extract_degraded === true;
        pending.extract.extract_degraded_reason = result.extract_degraded_reason || null;
        pending.extractDegraded = result.extract_degraded === true;
        pending.timing = { ...(pending.timing || {}), extract: result.timing };
        // Story가 생성한 [3. 선택지] 블록은 본문에 그대로 표시한다 (제거 호출 삭제).
        // The actual DOM patch is deferred to finalizeRenderedNarrative() —
        // the typing animation may still be running when Extract returns.
        if (result.narrative_replacement) {
          pending.narrative = result.narrative_replacement;
          pending.narrativeReplacement = result.narrative_replacement;
        } else if (result.content_addition) {
          // Legacy-compat only — current Worker responses always carry
          // narrative_replacement instead and leave this null.
          pending.narrative = `${pending.narrative}\n\n${result.content_addition}`;
          pending.contentAddition = result.content_addition;
        }
        await retryCommit(pending);
      } catch (error) {
        failed = true;
        if (await handleTurnFailureAsRollback(pending, '피드백 재생성에 실패하여 기존 턴을 복구했습니다.')) return;
        const code = error.details?.error_code || error.status || 'UNKNOWN';
        const requestId = error.details?.request_id;
        const suffix = requestId ? ` · 요청 ${requestId}` : '';
        await finalizeRenderedNarrative(pending);
        ui.markLastNarrativeUncommitted();
        // H2 item 13: Extract hard failures are now all one path — H1
        // removed the blocking NPC-contract check, and H2's degraded
        // fallback already absorbs anything that can safely continue, so
        // whatever still reaches this catch is a genuine hard failure with
        // no separate "regenerate the narrative" option to offer.
        ui.showPendingTurnActions(
          `서사는 생성되었지만 상태 분석에 실패했습니다. [${code}]${suffix} 이 서사는 아직 저장되지 않았습니다.`,
          [
            { label: '상태 분석 다시 시도', onClick: () => retryExtract(pending) },
            { label: '이번 서사 버리고 이전 턴으로 돌아가기', onClick: () => discardFailedTurn() }
          ]
        );
      } finally {
        state.isStreaming = false;
        // Set before setLoading(false) — and stays set through it — so that
        // retryStory's own finally (which also calls ui.setLoading(false)
        // right after this function returns) can't silently re-enable the
        // input out from under a still-unresolved failure notice.
        if (failed) state.inputLocked = true;
        ui.setLoading(false);
        if (failed) ui.setChoicesEnabled(false);
      }
    }

    async function retryCommit(pending) {
      state.isStreaming = true;
      state.inputLocked = false;
      ui.setLoading(true, '턴 저장 중');
      ui.clearPendingTurnActions();
      try {
        // Runs immediately after Extract, in parallel with the still-typing
        // display queue — only the DOM updates below wait for renderDone.
        const saved = await api.commitTurn(state.gameId, pending.nextTurn, pending.narrative, pending.extract, pending.mode === 'opening' ? { opening_started: true } : {}, pending.input, pending.playerAction);
        state.turnCount = saved.turn_count; ui.updateMeta(null, state.turnCount);
        pending.timing = { ...(pending.timing || {}), commit: saved.timing };
        if (saved.npc_stats) pending.extract.npc_stats = saved.npc_stats;
        if (saved.npc_stat_changes) pending.extract.npc_stat_changes = saved.npc_stat_changes;
        if (Number.isInteger(saved.image_id)) pending.extract.image_id = saved.image_id;
        if (typeof saved.image_scene_role === 'string') pending.extract.image_scene_role = saved.image_scene_role;
        if (pending.rollbackInfo) {
          // A feedback-regenerated commit's patch is computed against the
          // rolled-back (pre-turn) save, not against whatever state.context.save
          // still holds client-side from the cancelled turn — incrementally
          // merging the new patch onto that stale base could leave fields the
          // cancelled turn changed (but this one doesn't) stuck at their old
          // values. A fresh full reload is the only way to guarantee this
          // matches the server exactly.
          try {
            const refreshed = await api.context(state.gameId);
            state.context = refreshed.context || state.context;
          } catch (error) {
            console.error('post-feedback context refresh failed', error);
          }
        } else if (saved.state_patch) {
          // Keeps 어플 정보 (and anything else reading state.context.save)
          // current immediately after commit, instead of showing the
          // pre-commit snapshot until the next full /api/context reload.
          state.context = state.context || {};
          state.context.save = deepMergeStatePatch(state.context.save, saved.state_patch);
        }
        ui.clearUncommittedNarrativeBadges();
        saveFeedback([]);

        // Screen updates (narrative text/choices/sidebar/media/scroll) wait
        // for the typing animation to actually finish — everything above
        // this point (Story/Extract/Commit's own network calls) never was.
        await finalizeRenderedNarrative(pending);

        // H2 item 12: a degraded turn saved narrative + choices only — NPC
        // stats/mind/image are all untouched, so the sidebar and any shown
        // image must keep showing whatever was already there, and there is
        // nothing new for TTS to read.
        if (pending.extractDegraded) {
          if (!pending.degradedNoticeShown) {
            ui.showSystemMessage('상태 분석 일부를 복구하지 못해 이번 턴은 서사와 선택지만 저장했습니다. NPC 수치·이미지·암시·상식개변 상태는 변경되지 않았습니다.');
            pending.degradedNoticeShown = true;
          }
        } else {
          sidebar.updateCharacter(pending.extract.character_id); sidebar.updateMind(pending.extract.npc_emotion); sidebar.renderStats(pending.extract.npc_stats, pending.extract.character_id, pending.extract.npc_stat_changes);
          prepareMedia(pending.extract);
        }
        ui.renderGameplayChoices(pending.extract.choices, submitChoice, { setup: pending.mode === 'player_setup' });
        console.info('[turn-timing]', {
          turn: pending.nextTurn,
          story_first_content_ms: pending.timing?.story?.first_content_ms ?? null,
          story_total_ms: pending.timing?.story?.stream_total_ms ?? null,
          extract_total_ms: pending.timing?.extract?.deepseek_total_ms ?? null,
          commit_total_ms: pending.timing?.commit?.total_ms ?? null,
          total_ms: [pending.timing?.story?.stream_total_ms, pending.timing?.extract?.total_ms, pending.timing?.commit?.total_ms]
            .reduce((sum, value) => sum + (value || 0), 0)
        });
      } catch (error) {
        if (await handleTurnFailureAsRollback(pending, '피드백 재생성에 실패하여 기존 턴을 복구했습니다.')) return;
        if (error.status === 409) {
          document.getElementById('chat-input').value = pending.input;
          ui.showSystemMessage('다른 창에서 게임이 먼저 진행되었습니다. 최신 상태를 다시 불러왔습니다.');
          await loadGameContext();
        } else {
          await finalizeRenderedNarrative(pending);
          const code = error.details?.error_code || error.status || 'UNKNOWN';
          const requestId = error.details?.request_id;
          const suffix = requestId ? ` · 요청 ${requestId}` : '';
          ui.showRetryNotice(
            `서사와 상태 분석은 완료됐지만 저장에 실패했습니다. [${code}]${suffix}`,
            '저장 다시 시도',
            () => retryCommit(pending)
          );
        }
      } finally { state.isStreaming = false; ui.setLoading(false); }
    }

    function prepareMedia(extract) {
      tts.enqueue(extract, state.turnCount);
      if (extract.character_id && extract.character_id !== 'narrator') {
        ui.setLoading(true, '이미지 준비 중');
        api.image(state.gameId, extract.character_id, extract.image_id)
          .then(res => { if (res.image_url) ui.showImage(res.image_url); })
          .catch(() => ui.showRetryNotice('이미지를 불러오지 못했습니다.', '이미지만 다시 불러오기', () => prepareMedia({ ...extract, dialogue_lines: [] }), false))
          .finally(() => ui.setLoading(false));
      }
    }

    function createManualElement(tag, className = '', text = '') {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function appendManualList(parent, items, ordered = false) {
      const list = createManualElement(ordered ? 'ol' : 'ul', 'app-manual-list');
      (Array.isArray(items) ? items : []).forEach(text => list.appendChild(createManualElement('li', '', String(text))));
      parent.appendChild(list);
    }

    function manualSection(title, open, render) {
      const details = createManualElement('details', 'app-manual-section');
      details.open = open;
      details.appendChild(createManualElement('summary', '', title));
      const body = document.createElement('div');
      render(body);
      details.appendChild(body);
      return details;
    }

    function renderManualStatus(manual) {
      const status = manual.status || {};
      const grid = createManualElement('div', 'app-manual-status-grid');
      const card = (label, value, detail = '') => { const node = createManualElement('div', 'app-manual-card'); node.append(createManualElement('small', '', label), createManualElement('strong', '', value)); if (detail) node.appendChild(createManualElement('small', '', detail)); grid.appendChild(node); return node; };
      const expCard = card('경험치', `${status.exp || 0} / ${status.next_level_exp || 0}`);
      const progress = createManualElement('div', 'app-manual-progress'); const fill = createManualElement('div', 'app-manual-progress-fill'); const percent = Number(status.exp_percent) || 0; fill.style.width = `${percent}%`; progress.setAttribute('role', 'progressbar'); progress.setAttribute('aria-valuemin', '0'); progress.setAttribute('aria-valuemax', '100'); progress.setAttribute('aria-valuenow', String(percent)); progress.appendChild(fill); expCard.appendChild(progress);
      card('레벨', `Lv.${status.level || 1}`); card('사용 가능 암시', `${status.available_strength || '약함'}까지`); card('개인 암시', `${status.suggestion_active || 0} / ${status.suggestion_max || 0}`, `남은 슬롯 ${status.suggestion_remaining || 0}`); card('상식개변', `${status.csa_active || 0} / ${status.csa_max || 0}`, `현재 범위: ${status.csa_scope_label || '-'}`); card('오늘 상식개변', `${status.csa_daily_used || 0} / ${status.csa_daily_limit || 0}회`);
      return grid;
    }

    function renderManualTiers(body, tiers, includeDescription = false) {
      (Array.isArray(tiers) ? tiers : []).forEach(tier => {
        const details = createManualElement('details', 'app-manual-tier');
        details.appendChild(createManualElement('summary', '', tier.available ? `${tier.label} · 사용 가능` : `${tier.label} · Lv.${tier.unlock_level} 해금 🔒`));
        const content = document.createElement('div');
        if (!tier.available) content.appendChild(createManualElement('p', '', '현재 레벨에서는 이 단계의 상세 예시를 확인할 수 없습니다.'));
        else { if (includeDescription && tier.description) content.appendChild(createManualElement('p', '', tier.description)); appendManualList(content, tier.examples, true); }
        details.appendChild(content); body.appendChild(details);
      });
    }

    function renderAppManualModal(manual, opener) {
      const overlay = createManualElement('div', 'app-manual-overlay');
      const modal = createManualElement('div', 'app-manual-modal'); modal.setAttribute('role', 'dialog'); modal.setAttribute('aria-modal', 'true'); modal.setAttribute('aria-labelledby', 'app-manual-title');
      const header = createManualElement('header', 'app-manual-header'); const heading = document.createElement('div'); const title = createManualElement('h2', '', manual.title || '최면 어플 사용자 매뉴얼'); title.id = 'app-manual-title'; heading.append(title, createManualElement('p', '', manual.subtitle || '')); const close = createManualElement('button', 'app-manual-close', '닫기'); close.type = 'button'; close.setAttribute('aria-label', '매뉴얼 닫기'); header.append(heading, close);
      const body = createManualElement('div', 'app-manual-body');
      body.appendChild(manualSection('현재 어플 상태', true, section => section.appendChild(renderManualStatus(manual))));
      body.appendChild(manualSection('현재 상태 진단', true, section => (manual.diagnostics || []).forEach(item => section.appendChild(createManualElement('div', `app-manual-diagnostic ${item.type || 'info'}`, item.text)))));
      body.appendChild(manualSection('빠른 사용법', true, section => appendManualList(section, manual.quick_start, true)));
      body.appendChild(manualSection('개인 암시', false, section => { section.append(createManualElement('p', '', manual.suggestions?.description || ''), createManualElement('h3', '', '규칙')); appendManualList(section, manual.suggestions?.rules); renderManualTiers(section, manual.suggestions?.tiers, true); }));
      body.appendChild(manualSection('상식개변', false, section => { section.appendChild(createManualElement('p', '', manual.common_sense?.description || '')); appendManualList(section, manual.common_sense?.rules); section.appendChild(createManualElement('p', '', `현재 범위: ${manual.common_sense?.current_scope?.label || '-'}`)); appendManualList(section, (manual.common_sense?.scope_unlocks || []).map(item => `${item.level_range} · ${item.scope_label} · 활성 ${item.max_active}개 · 하루 ${item.daily_limit}회${item.available ? ' · 사용 가능' : ''}`)); renderManualTiers(section, manual.common_sense?.tiers); }));
      body.appendChild(manualSection('최면깊이', false, section => { section.appendChild(createManualElement('p', '', manual.hypnosis_depth?.description || '')); appendManualList(section, manual.hypnosis_depth?.rules); }));
      body.appendChild(manualSection('NPC 수치 설명', false, section => (manual.stats || []).forEach(stat => { const item = createManualElement('div', 'app-manual-active-item'); item.append(createManualElement('strong', '', `${stat.label} (${stat.range})`), createManualElement('div', '', stat.description), createManualElement('small', '', stat.change_rule)); section.appendChild(item); })));
      body.appendChild(manualSection('레벨·해금 기능', false, section => (manual.unlocks || []).forEach(unlock => { const title = createManualElement('p', '', `Lv.${unlock.level}`); section.appendChild(title); appendManualList(section, unlock.items); })));
      body.appendChild(manualSection('현재 활성 효과', true, section => { const effects = manual.active_effects || {}; if (!(effects.suggestions || []).length && !(effects.common_sense || []).length) { section.appendChild(createManualElement('p', '', '현재 활성 효과가 없습니다.')); return; } const groups = new Map(); (effects.suggestions || []).forEach(item => groups.set(item.character_name, [...(groups.get(item.character_name) || []), item])); groups.forEach((items, name) => { section.appendChild(createManualElement('h3', '', name)); items.forEach(item => section.appendChild(createManualElement('div', 'app-manual-active-item', `[${item.strength}] ${item.content}`))); }); (effects.common_sense || []).forEach(item => section.appendChild(createManualElement('div', 'app-manual-active-item', `[${item.scope_label} · ${item.strength}]\n${item.content}`))); }));
      body.appendChild(manualSection('자주 발생하는 실패 원인', false, section => (manual.common_failures || []).forEach(item => { section.appendChild(createManualElement('h3', '', item.title)); appendManualList(section, item.reasons); })));
      const closeModal = () => { document.removeEventListener('keydown', onKey); overlay.remove(); opener?.focus(); };
      const onKey = event => { if (event.key === 'Escape') closeModal(); };
      close.addEventListener('click', closeModal); overlay.addEventListener('click', event => { if (event.target === overlay) closeModal(); }); document.addEventListener('keydown', onKey);
      modal.append(header, body); overlay.appendChild(modal); document.body.appendChild(overlay); close.focus();
    }

    async function showAppManual() {
      if (document.querySelector('.app-manual-overlay')) return;
      const opener = document.getElementById('app-info-side-button');
      if (!state.gameId) return;
      if (opener) { opener.disabled = true; opener.textContent = '불러오는 중…'; }
      try { const result = await api.appManual(state.gameId); renderAppManualModal(result.manual || {}, opener); }
      catch (error) {
        const overlay = createManualElement('div', 'app-manual-overlay'); const box = createManualElement('div', 'app-manual-modal'); const body = createManualElement('div', 'app-manual-error', '매뉴얼을 불러오지 못했습니다.'); const actions = createManualElement('div', 'app-manual-error-actions'); const retry = createManualElement('button', 'choice-btn', '다시 시도'); const close = createManualElement('button', 'choice-btn', '닫기'); actions.append(retry, close); body.appendChild(actions); box.appendChild(body); overlay.appendChild(box); const dismiss = () => { overlay.remove(); opener?.focus(); }; retry.addEventListener('click', () => { overlay.remove(); showAppManual(); }); close.addEventListener('click', dismiss); overlay.addEventListener('click', event => { if (event.target === overlay) dismiss(); }); document.body.appendChild(overlay); close.focus(); }
      finally { if (opener) { opener.disabled = false; opener.textContent = '📘 어플 매뉴얼'; } }
    }

    function submitChoice(choiceText, meta = {}) {
      tts.unlockAudio();
      document.getElementById('chat-input').value = choiceText;
      handleTurnInput({
        source: 'choice_button',
        choice_index: meta.choice_index,
        choice_text: choiceText
      });
    }

    // Reloads the server's last-committed state and re-renders it — since
    // nothing about the in-progress turn was ever committed, this is both
    // "resume" (nothing pending) and "discard the failed turn" (something
    // pending that never made it to the DB) at once.
    async function restoreToLastCommittedTurn(message) {
      await loadGameContext();
      restoreLastTurn();
      const savedChoices = Array.isArray(state.context?.save?.last_choices) ? state.context.save.last_choices : [];
      const choices = savedChoices.length ? savedChoices : ui.parseChoices(state.context?.recent_memories?.at(-1)?.content || '');
      const setup = state.context?.save?.player_setup?.status !== 'complete';
      ui.renderGameplayChoices(choices, submitChoice, { setup });
      ui.showSystemMessage(message);
    }

    async function resumeGame() {
      const button = document.getElementById('resume-game-button');
      if (state.isStreaming) return;
      if (button) button.disabled = true;
      try {
        await restoreToLastCommittedTurn('현재 게임을 이어서 진행합니다.');
      } finally {
        if (button) button.disabled = false;
      }
    }

    // The "discard" side of the Extract-failure choice: the failed
    // narrative was never committed, so reloading the server's truth and
    // dropping the local uncommitted DOM state is sufficient to undo it.
    async function discardFailedTurn() {
      if (state.isStreaming) return;
      state.isStreaming = true;
      state.inputLocked = false;
      ui.setChatInputEnabled(false);
      try {
        await restoreToLastCommittedTurn('실패한 서사를 취소하고 이전 턴으로 돌아갔습니다.');
      } finally {
        state.isStreaming = false;
        ui.setChatInputEnabled(true);
      }
    }

    async function startPlayerSetup() {
      if (!state.gameId || state.isStreaming || state.startupRequested) return;
      state.startupRequested = true;
      try {
        await runTurn({ playerInput: '__START_PLAYER_SETUP__', systemStart: true });
      } finally {
        state.startupRequested = false;
      }
    }

    window.resumeGame = resumeGame;
    window.showAppManual = showAppManual;
    window.showAppInfo = showAppManual;
    window.showResetModal = showResetModal;
    window.showFeedbackModal = showFeedbackModal;

  </script>
</body>
</html>
