name: Convert CSA Only

on:
  push:
    branches:
      - feature/csa-only
    paths:
      - .github/workflows/convert-csa-only.yml
      - .github/scripts/convert_csa_only.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: ${{ !contains(github.event.head_commit.message, 'refactor: convert game to csa-only mode') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/csa-only

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply CSA-only conversion
        run: python .github/scripts/convert_csa_only.py

      - name: Static checks
        run: |
          node --check worker/game-proxy-v2.js
          node --check pages/sidebar.js
          node --check pages/hypnosis-app.js
          git diff --check

      - name: Remove one-shot files
        run: |
          rm -f .github/scripts/convert_csa_only.py
          rm -f .github/workflows/convert-csa-only.yml

      - name: Commit converted branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: convert game to csa-only mode"
          git push origin HEAD:feature/csa-only
